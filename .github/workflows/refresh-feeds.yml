# Keeps the Watch and Articles pages current without anyone running scripts.
# Every morning it reads the YouTube and Medium feeds, rebuilds the site, and
# commits only if something actually changed. GitHub Pages then republishes.
# It can also be run by hand from the repo's Actions tab.
name: Refresh videos and articles

on:
  schedule:
    - cron: "17 11 * * *"     # daily, 11:17 UTC (early morning in Colorado)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (thumbnails)
        run: pip install pillow

      - name: Fetch feeds
        # A feed being briefly unavailable should not fail the run or wipe the page.
        run: |
          python3 tools/fetch_videos.py   || echo "::warning::YouTube feed fetch failed"
          python3 tools/fetch_articles.py || echo "::warning::Medium feed fetch failed"

      - name: Build and check
        run: |
          python3 tools/build.py
          python3 tools/check_site.py

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name  "karis-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Refresh videos and articles from their feeds"
          git push
